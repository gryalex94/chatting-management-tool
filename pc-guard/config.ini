[telegram]
# Your Telegram bot token (from @BotFather)
bot_token = PASTE_YOUR_BOT_TOKEN_HERE

# Your Telegram chat ID (the bot sends messages here)
chat_id = PASTE_YOUR_CHAT_ID_HERE

[settings]
# Heartbeat interval in minutes (detects if program was killed)
heartbeat_minutes = 5

# How many minutes before time-up to send a warning
warning_minutes = 5

# Name shown in messages (so you know which PC if you have several)
pc_name = Son's PC
