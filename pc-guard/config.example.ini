[telegram]
# Your Telegram bot token (from @BotFather)
bot_token = PASTE_YOUR_BOT_TOKEN_HERE

# Your Telegram chat ID (the bot sends messages here)
chat_id = PASTE_YOUR_CHAT_ID_HERE

# Optional: Telegram user IDs allowed to send commands, separated by commas
# (for example you and your partner: 11111111, 22222222). Get an ID from
# @userinfobot. If left empty, only a private chat with chat_id is accepted.
allowed_user_ids =

[settings]
# Heartbeat interval in minutes (detects if program was killed)
heartbeat_minutes = 5

# How many minutes before time-up to send a warning
warning_minutes = 5

# Name shown in messages (so you know which PC if you have several)
pc_name = Son's PC

# Your time zone, in hours from UTC (e.g. 0 = London in winter, 1 = Berlin
# in winter, 2 = Kyiv in winter, -5 = New York in winter). The installer fills
# this in for you. PC Guard uses this instead of the PC's own time zone
# setting, which your son could change.
utc_offset_hours = 0

# The timer is cleared once a day at this hour (4 = 4 AM), not at midnight
new_day_starts_at_hour = 4

# What happens when time is up (after a 1-minute warning):
#   lock   = go to the sign-in screen; his programs stay open (default)
#   logoff = sign him out; anything unsaved is lost
# Either way it happens again every time he signs back in, until you add time.
time_up_action = lock
