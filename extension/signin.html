<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Chatting Manager</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #6b6b76; --bg: #f4f4f7; --card: #ffffff; --line: #e4e4ea; --bad: #c62828; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececf1; --muted: #9a9aa6; --bg: #141418; --card: #1c1c21; --line: #33333b; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 22px 20px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 8px; font-size: 13px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 10px; color: var(--bad); font-size: 13px; white-space: pre-wrap; }
    .small { margin-top: 14px; font-size: 12px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Chatting Manager</h1>
    <p>Fansly opens after you sign in with your account from the tool. Everything you do in the chats is recorded under your name.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="signin" type="submit">Sign in</button>
    <div id="err" class="err"></div>
    <p class="small" id="version"></p>
  </form>
  <script src="signin.js"></script>
</body>
</html>
