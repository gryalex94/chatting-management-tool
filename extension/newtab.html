<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New tab</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #6b6b76; --bg: #ffffff; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececf1; --muted: #9a9aa6; --bg: #1c1c21; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    .box { text-align: center; padding: 16px; max-width: 360px; }
    a { display: inline-block; margin-top: 12px; padding: 9px 16px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <div class="box">
    <h1 style="font-size:18px;margin:0">Chatting Manager</h1>
    <p id="text">Only Fansly's chats open in this browser.</p>
    <a href="https://fansly.com/messages">Open the chats</a>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
